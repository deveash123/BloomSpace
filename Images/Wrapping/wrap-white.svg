<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="whitePaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F9F7F5" />
      <stop offset="100%" stop-color="#EDE7E1" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#594B49" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#FBF9F7" />
  <rect x="25" y="25" width="350" height="350" rx="12" fill="url(#whitePaper)" stroke="#E8E2DC" stroke-width="2" filter="url(#softShadow)" />
  <line x1="45" y1="60" x2="355" y2="60" stroke="#EAE4DE" stroke-width="1" stroke-dasharray="8 6"/>
  <line x1="45" y1="120" x2="355" y2="120" stroke="#EAE4DE" stroke-width="1" stroke-dasharray="8 6"/>
  <line x1="45" y1="180" x2="355" y2="180" stroke="#EAE4DE" stroke-width="1" stroke-dasharray="8 6"/>
  <line x1="45" y1="240" x2="355" y2="240" stroke="#EAE4DE" stroke-width="1" stroke-dasharray="8 6"/>
  <line x1="45" y1="300" x2="355" y2="300" stroke="#EAE4DE" stroke-width="1" stroke-dasharray="8 6"/>
  <text x="200" y="200" text-anchor="middle" font-family="'Playfair Display', serif" font-size="20" font-weight="600" fill="#7A6864" letter-spacing="2">PREMIUM WHITE</text>
  <text x="200" y="228" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" fill="#A89A96" letter-spacing="3">TEXTURED LINEN</text>
</svg>
